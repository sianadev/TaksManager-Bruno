info:
  name: Login Mail et mot de passe valides
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}{{apiLogin}}"
  body:
    type: json
    data: |-
      {
        "email": "{{mailOK}}",
        "password": "{{passwordOK}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
