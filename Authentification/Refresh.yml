info:
  name: "Refresh "
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseURL}}/api/authentication/refresh"
  auth:
    type: bearer
    token: "{{refreshToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        try {
          const email = bru.getEnvVar("mailOK");
          const password = bru.getEnvVar("passwordOK");

          const res = await bru.sendRequest({
            method: 'POST',
            url: 'https://taskmanager.stl-training.fr/api/authentication/login',
            headers: {
              'Content-Type': 'application/json'
            },
            data: {
              email: email,
              password: password
            }
          });

          console.log("login status:", res.status);

          const token = res.data.token;
          const refreshToken = res.data.refreshToken;

          bru.setVar("token", token);
          bru.setVar("refreshToken",refreshToken)
          

        } catch (err) {
          console.log("ERREUR:", err.response ? err.response.data : err.message);
        }
    - type: tests
      code: |-
        test("le statut est 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
