info:
  name: Register Mail valide et mot de passe vide
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseURL}}{{apiRegister}}"
  body:
    type: json
    data: |-
      {
        "email": "{{randomEmail}}",
        "password": ""
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("randomEmail", bru.interpolate("{{$randomEmail}}"));
        //console.log(bru.getVar("randomEmail"));
    - type: tests
      code: |-
        test("le statut est 422", function () {
          expect(res.getStatus()).to.equal(422);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
