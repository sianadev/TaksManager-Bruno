opencollection: 1.0.0

info:
  name: TaskManager
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  scripts:
    - type: tests
      code: |-
        test("le temps de réponse est inférieur à 200ms", function () {
          const responseTime = res.getResponseTime();
          expect(responseTime).to.be.below(200);
        });
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
